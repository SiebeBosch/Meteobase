Define SRVROOT "c:/Apache24"

ServerRoot "${SRVROOT}"

Listen 80
Listen 8080

LoadModule actions_module modules/mod_actions.so
LoadModule alias_module modules/mod_alias.so
LoadModule allowmethods_module modules/mod_allowmethods.so
LoadModule asis_module modules/mod_asis.so
LoadModule auth_basic_module modules/mod_auth_basic.so

LoadModule authn_core_module modules/mod_authn_core.so
LoadModule authn_file_module modules/mod_authn_file.so
LoadModule authz_core_module modules/mod_authz_core.so
LoadModule authz_groupfile_module modules/mod_authz_groupfile.so
LoadModule authz_host_module modules/mod_authz_host.so
LoadModule authz_user_module modules/mod_authz_user.so
LoadModule autoindex_module modules/mod_autoindex.so
LoadModule cgi_module modules/mod_cgi.so
LoadModule dir_module modules/mod_dir.so
LoadModule env_module modules/mod_env.so
LoadModule include_module modules/mod_include.so
LoadModule isapi_module modules/mod_isapi.so
LoadModule log_config_module modules/mod_log_config.so
LoadModule mime_module modules/mod_mime.so
LoadModule negotiation_module modules/mod_negotiation.so
LoadModule setenvif_module modules/mod_setenvif.so
LoadModule socache_shmcb_module modules/mod_socache_shmcb.so
LoadModule ssl_module modules/mod_ssl.so

LoadModule proxy_module modules/mod_proxy.so
LoadModule proxy_connect_module modules/mod_proxy_connect.so
LoadModule proxy_http_module modules/mod_proxy_http.so
# ONDERHOUD: nodig voor onderhoudsmodus
LoadModule rewrite_module modules/mod_rewrite.so
LoadModule headers_module modules/mod_headers.so
<IfModule unixd_module>

User daemon
Group daemon

</IfModule>


ServerAdmin admin@example.com
ServerName localhost:8080

# Geen versie-informatie in Server-header en foutpagina's (2026-10-22)
ServerTokens Prod
ServerSignature Off


<Directory />
    AllowOverride none
    Require all denied
    DirectoryIndex index.php
</Directory>

DocumentRoot "${SRVROOT}/htdocs"
# Terug naar onderhoudsmodus: zie conf\ONDERHOUDSMODUS.txt

<Directory "${SRVROOT}/htdocs">

    # no directory listings anywhere in htdocs (2026-10-25)
    Options FollowSymLinks


    AllowOverride None


    Require all granted
</Directory>

<IfModule dir_module>
    DirectoryIndex index.php
</IfModule>

<Files ".ht*">
    Require all denied
</Files>

# Log- en back-upbestanden nooit via de webserver uitserveren (2026-10-22)
<FilesMatch "\.(log|bak|old|sql)$">
    Require all denied
</FilesMatch>

# DataLoad/DataValidation-scripts schrijven in data.* en draaien alleen via de CLI (2026-10-22)
<Directory "${SRVROOT}/htdocs/backoffice/DataLoad">
    Require all denied
</Directory>
<Directory "${SRVROOT}/htdocs/backoffice/DataValidation">
    Require all denied
</Directory>
<FilesMatch "^(ScriptProcess[A-Za-z]+|FormDataProcessing|dataload_bootstrap)\.php$">
    Require all denied
</FilesMatch>

# backoffice/ wordt alleen via PHP-include gebruikt; via HTTP alleen de onderhoudslogin (2026-10-22)
<Directory "${SRVROOT}/htdocs/backoffice">
    Require all denied
    <Files "backoffice_su.php">
        Require all granted
    </Files>
</Directory>

# meteobase/python is the source of the regenduurlijnen backend (Waitress on 127.0.0.1:5000, reached via
# ProxyPass /regenduurlijnen); it must not be served over HTTP (2026-10-23)
<Directory "${SRVROOT}/htdocs/meteobase/python">
    Require all denied
</Directory>

# downloads/ holds customers' order files; they are reachable only via the exact link in the e-mail,
# never through a directory listing (also covers all subfolders) (2026-10-25)
<Directory "${SRVROOT}/htdocs/meteobase/downloads">
    Options -Indexes
</Directory>

# uploads/ (root) receives shapefiles from the old pages/upload.php; it is only read from the file system
# and must not be served over HTTP (2026-10-25)
<Directory "${SRVROOT}/htdocs/uploads">
    Require all denied
</Directory>

# meteobase/uploads/ receives the customers' shapefiles (pages/rasterDataUpload.php); the tools and PHP read
# them from the file system, so they must not be served over HTTP (2026-10-26)
<Directory "${SRVROOT}/htdocs/meteobase/uploads">
    Require all denied
</Directory>

ErrorLog "logs/error.log"

LogLevel warn

<IfModule log_config_module>

    LogFormat "%h %l %u %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\"" combined
    LogFormat "%h %l %u %t \"%r\" %>s %b" common

    <IfModule logio_module>
      LogFormat "%h %l %u %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\" %I %O" combinedio
    </IfModule>

    CustomLog "logs/access.log" common


</IfModule>

<IfModule alias_module>

    ScriptAlias /cgi-bin/ "${SRVROOT}/cgi-bin/"

</IfModule>

<IfModule cgid_module>

</IfModule>

<Directory "${SRVROOT}/cgi-bin">
    AllowOverride None
    Options None
    Require all granted
</Directory>

<IfModule headers_module>

    RequestHeader unset Proxy early
</IfModule>

<IfModule mime_module>

    TypesConfig conf/mime.types


    AddType application/x-compress .Z
    AddType application/x-gzip .gz .tgz

</IfModule>

<IfModule proxy_html_module>
Include conf/extra/proxy-html.conf
</IfModule>

Include conf/extra/httpd-ssl.conf

<IfModule ssl_module>
SSLRandomSeed startup builtin
SSLRandomSeed connect builtin
</IfModule>

<IfModule mod_proxy.c>

ProxyRequests Off

<Proxy *>
Require all granted
</Proxy>

SSLProxyEngine on
ProxyPass /regenduurlijnen http://localhost:5000
ProxyPassReverse /regenduurlijnen http://localhost:5000


</IfModule>


# PHP 8.5 (tot 2026-10-21: PHP 7.4 uit c:/php)
LoadFile "C:/php8/libpq.dll"
LoadModule php_module "C:/php8/php8apache2_4.dll"
PHPIniDir "C:/php8"
<FilesMatch "\.php$">
    SetHandler application/x-httpd-php
</FilesMatch>

DirectoryIndex index.html index.php






